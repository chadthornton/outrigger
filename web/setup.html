<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FM-1 Hub setup</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0c;color:#f2f2f2;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:max(20px,env(safe-area-inset-top)) 18px 32px}
main{max-width:460px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
p{color:#9a9a9a;margin:0 0 16px}
ul{list-style:none;margin:0 0 14px;padding:0;border:1px solid #26262a;border-radius:12px;overflow:hidden}
li{padding:12px 14px;border-bottom:1px solid #26262a;display:flex;gap:10px;cursor:pointer;background:#151517}
li:last-child{border-bottom:0}
li.sel{background:#1d3d6b}
li span:first-child{flex:1;overflow-wrap:anywhere}
li .bars{color:#8a8a8a;font-size:13px}
input,button{font:inherit;width:100%;border-radius:10px;padding:11px 12px;margin:0 0 10px;color:#f2f2f2}
input{background:#0e0e10;border:1px solid #34343a}
button{background:#1d3d6b;border:1px solid #2b5596;cursor:pointer}
button.quiet{background:#232327;border-color:#34343a}
#msg{min-height:1.5em}
.err{color:#ff4a4a}
.ok{color:#22dd44}
</style>
</head>
<body>
<main>
<h1>Put the hub on your Wi-Fi</h1>
<p>Pick your home network. Afterwards the hub's page is at <b>http://fm1hub.local</b> from any device on that network.</p>
<ul id="list"><li><span>Looking for networks…</span></li></ul>
<button class="quiet" id="rescan">Look again</button>
<input id="ssid" placeholder="Network name" autocapitalize="off" autocorrect="off">
<input id="pass" type="password" placeholder="Password" autocomplete="current-password">
<button id="join">Join</button>
<div id="msg"></div>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let apChannel = 0, nets = [];
function bars(rssi) { return rssi > -55 ? "▂▄▆█" : rssi > -67 ? "▂▄▆" : rssi > -78 ? "▂▄" : "▂"; }
async function scan() {
  try {
    const j = await (await fetch("/api/wifi/scan")).json();
    apChannel = j.ap_ch;
    const best = {};
    for (const n of j.nets) if (!best[n.ssid] || best[n.ssid].rssi < n.rssi) best[n.ssid] = n;
    nets = Object.values(best).sort((a, b) => b.rssi - a.rssi);
    const list = $("list");
    if (!nets.length) { list.innerHTML = "<li><span>None found yet — tap Look again.</span></li>"; return; }
    list.replaceChildren(...nets.map(n => {
      const li = document.createElement("li");
      li.innerHTML = "<span></span><span class=bars></span>";
      li.children[0].textContent = n.ssid + (n.open ? " (open)" : "");
      li.children[1].textContent = bars(n.rssi);
      li.onclick = () => { for (const x of list.children) x.classList.remove("sel"); li.classList.add("sel"); $("ssid").value = n.ssid; $("pass").focus(); };
      return li;
    }));
  } catch (e) {}
}
$("rescan").onclick = () => { scan(); setTimeout(scan, 4000); };

function say(cls, html) { const m = $("msg"); m.className = cls; m.innerHTML = html; }
const esc = t => t.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Follows the join until it works or fails. The hotspot normally sits on the
// network's channel, so this phone stays connected and sees the result.
async function follow(ssid) {
  const until = Date.now() + 40000;
  while (Date.now() < until) {
    await new Promise(r => setTimeout(r, 1000));
    let st;
    try { st = await (await fetch("/api/wifi/state", { signal: AbortSignal.timeout(2500) })).json(); } catch (e) { continue; }
    if (st.state === "joined") {
      say("ok", `✓ The hub is on <b>${esc(ssid)}</b> at ${esc(st.ip)}.<br>Switch this phone back to ${esc(ssid)}, then open ` +
        `<a href="http://fm1hub.local/" style="color:#5a9cff">http://fm1hub.local</a>. This hotspot closes in a minute.`);
      $("join").disabled = false;
      return;
    }
    if (st.state === "failed") {
      say("err", `Couldn't join ${esc(ssid)}. Check the password and try again.`);
      $("join").disabled = false;
      return;
    }
  }
  say("err", `No answer from the hub. If this phone dropped off the hotspot, look at the hub's screen: ` +
    `it shows "On Wi-Fi" once it has joined.`);
  $("join").disabled = false;
}

$("join").onclick = async () => {
  const ssid = $("ssid").value;
  if (!ssid) { say("err", "Pick or type a network name."); return; }
  const net = nets.find(n => n.ssid === ssid);
  const moves = !net || net.ch !== apChannel;
  say("ok", `Joining ${esc(ssid)}…` + (moves ? " This phone may drop off the hotspot while the hub moves to that network's channel; the hub's screen shows \"On Wi-Fi\" when it's done." : ""));
  $("join").disabled = true;
  try {
    const r = await fetch("/api/wifi", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ssid, pass: $("pass").value }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || r.statusText); }
  } catch (e) {
    if (!(e instanceof TypeError)) { say("err", esc(e.message)); $("join").disabled = false; return; }
  }
  follow(ssid);
};
scan(); setTimeout(scan, 4000);
</script>
</body>
</html>
