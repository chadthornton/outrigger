[package]
name = "fm1-core"
description = "FM-1 CPU interpreter core; talks to the outside only through the Bus trait"
# fm1-emu 0.5.1, rev 60645a58d6cd1597ed565a3f00e4981964623232, MIT (LICENSE). Patched for the
# ESP32-P4: see ../README.md (a smaller instruction cache).
version = "0.5.1"
edition = "2021"
license = "MIT"

[dependencies]
fm1-isa = { git = "https://github.com/joakimeriksson/fm1-emu", rev = "60645a58d6cd1597ed565a3f00e4981964623232" }

[features]
# the small instruction cache on any host (on for riscv32 by itself), to measure it on a Mac
small_icache = []
