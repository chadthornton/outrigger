# The daily install email (index.js, summary.js). Its own Worker, apart from the
# Pages project: Pages Functions can't run on a schedule. Deployed with
# `make deploy-email` (tools/deploy_email.py), which also sets the TO secret.
name = "outrigger-install-email"
main = "index.js"
compatibility_date = "2026-10-01"
# No web address: nothing can call it but its cron.
workers_dev = false
preview_urls = false

# 15:00 UTC: 8am in California in summer, 7am in winter. It reports the day before.
[triggers]
crons = ["0 15 * * *"]

[vars]
FROM = "counts@outrigger.music"

# Read only: the Worker runs one SELECT on each. Same databases as wrangler.toml at the repo root.
[[d1_databases]]
binding = "DB"
database_name = "outrigger-reports"
database_id = "ceb31299-d7f7-49b6-8960-4891fc331ab5"

[[d1_databases]]
binding = "BETA"
database_name = "outrigger-reports-beta"
database_id = "93e9d893-e01a-488f-a594-cd5de5ff204a"

# Cloudflare Email Service. On the free plan it only delivers to addresses confirmed in the account.
[[send_email]]
name = "EMAIL"
