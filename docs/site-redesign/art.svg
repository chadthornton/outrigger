    <rect x="64" y="16" width="40" height="12" rx="3" fill="var(--screen, #111)"/>
    <g stroke="currentColor" stroke-width="2.5">
      <rect x="16" y="38" width="188" height="40" rx="3" fill="none"/>
      <path d="M39.5 38v40M63 38v40M86.5 38v40M110 38v40M133.5 38v40M157 38v40M180.5 38v40"/>
    </g>
    <g fill="currentColor">
      <rect x="32" y="38" width="13" height="24"/><rect x="56" y="38" width="13" height="24"/>
      <rect x="103" y="38" width="13" height="24"/><rect x="127" y="38" width="13" height="24"/><rect x="150" y="38" width="13" height="24"/>
    </g>
