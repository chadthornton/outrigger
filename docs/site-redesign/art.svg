  <symbol id="hub" viewBox="0 0 120 50">
    <rect x="4" y="6" width="112" height="38" rx="10" fill="var(--panel, #fff)" stroke="currentColor" stroke-width="3"/>
    <g fill="currentColor"><rect x="20" y="20" width="14" height="10" rx="3"/><rect x="42" y="20" width="14" height="10" rx="3"/>
      <rect x="64" y="20" width="14" height="10" rx="3"/><rect x="86" y="20" width="14" height="10" rx="3"/></g>
  </symbol>

  <!-- The whole rig: controller and FM-1 on the hub, Outrigger on the hub's upstream port. -->
  <symbol id="rig" viewBox="0 0 640 312">
    <g fill="none" stroke="var(--accent, #2a8)" stroke-width="4" stroke-linecap="round">
      <path d="M150 230 C 210 230, 230 200, 268 200"/>
      <path d="M372 200 C 410 200, 430 240, 470 240"/>
      <path d="M320 180 L 320 128"/>
    </g>
    <use href="#keyboard" x="0" y="185" width="160" height="66"/>
    <use href="#hub" x="262" y="176" width="116" height="48"/>
    <use href="#fm1" x="468" y="196" width="154" height="92"/>
    <use href="#board" x="276" y="8" width="88" height="124"/>
    <g font-family="system-ui, sans-serif" font-size="17" font-weight="650" fill="currentColor">
      <text x="80" y="282" text-anchor="middle">MIDI controller</text>
      <text x="543" y="306" text-anchor="middle">FM-1</text>
      <text x="376" y="74">Outrigger</text>
      <text x="320" y="250" text-anchor="middle" font-weight="400" opacity=".7">Powered USB hub</text>
    </g>
  </symbol>
  <!-- The hub's four connections, for the hub's zoom panel. -->
  <symbol id="hub-wiring" viewBox="0 0 500 190">
    <rect x="160" y="90" width="170" height="64" rx="14" fill="var(--panel, #fff)" stroke="currentColor" stroke-width="3"/>
    <text x="245" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="currentColor">Powered USB-C hub</text>
    <g fill="none" stroke-width="3.5" stroke-linecap="round">
      <path d="M245 90 V 34" stroke="var(--accent, #2a8)"/>
      <path d="M160 122 H 86" stroke="currentColor" stroke-dasharray="1 8"/>
      <path d="M330 108 H 400" stroke="var(--accent, #2a8)"/>
      <path d="M330 138 H 400" stroke="var(--accent, #2a8)"/>
    </g>
    <g font-family="system-ui, sans-serif" font-size="14" fill="currentColor">
      <text x="245" y="22" text-anchor="middle" font-weight="700">Outrigger</text>
      <text x="256" y="62" opacity=".75">host port: power and data</text>
      <text x="78" y="118" text-anchor="end" font-weight="700">Charger</text>
