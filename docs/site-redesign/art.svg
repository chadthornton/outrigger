  <symbol id="keyboard" viewBox="0 0 220 90">
    <rect x="4" y="4" width="212" height="82" rx="10" fill="var(--panel, #fff)" stroke="currentColor" stroke-width="3"/>
    <circle cx="26" cy="22" r="6" fill="none" stroke="currentColor" stroke-width="3"/>
